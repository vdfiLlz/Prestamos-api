spring.application.name=prestamos-equipos
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prestamosUAM}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:filito}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


app.jwt.secret=${JWT_SECRET:ClaveSecretaSuperSeguraDeAlMenos32CaracteresParaJWT123456}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}


app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin123*}
app.seed.user-password=${SEED_USER_PASSWORD:User123*}
app.seed.enabled=${SEED_ENABLED:true}
app.seed.sample-data=${SEED_SAMPLE_DATA:true}